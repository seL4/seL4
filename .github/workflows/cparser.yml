# Run the verification C parser on the main kernel configurations
#
# See cparser-run/builds.yml in the repo au-ts/seL4-ci-actions for configs.

name: C Parser

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  cparser:
    name: C Parser
    runs-on: ubuntu-latest
    steps:
    - uses: au-ts/seL4-ci-actions/cparser-run@julia/fix-stm32-cpus
